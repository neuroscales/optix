[project]
nav = [
  {"Home" = "index.md"},
  {"Getting started" = [
    "getting-started/installation.md",
    "getting-started/quick-tour.md",
  ]},
  {"Concepts" = [
    "concepts/index.md",
    "concepts/notation.md",
    "concepts/axes-and-layouts.md",
    "concepts/image-formation.md",
    "concepts/estimators.md",
    "concepts/distributions.md",
  ]},
  {"Algorithms" = [
    "algorithms/index.md",
    {"Sensor" = [
      "algorithms/sensor/poisson-gaussian.md",
      "algorithms/sensor/generalized-anscombe.md",
      "algorithms/sensor/photon-transfer-curve.md",
      "algorithms/sensor/scmos-calibration.md",
      "algorithms/sensor/dark-flat-calibration.md",
      "algorithms/sensor/defective-pixels.md",
    ]},
    {"Shading" = [
      "algorithms/shading/basic.md",
      "algorithms/shading/cidre.md",
      "algorithms/shading/likar-entropy.md",
      "algorithms/shading/illumination-function.md",
      "algorithms/shading/gamma-mixture.md",
    ]},
    {"Deconvolution" = [
      "algorithms/deconv/richardson-lucy.md",
      "algorithms/deconv/biggs-andrews.md",
      "algorithms/deconv/snyder.md",
      "algorithms/deconv/wiener.md",
      "algorithms/deconv/tikhonov.md",
      "algorithms/deconv/wiener-butterworth.md",
    ]},
    {"Destriping" = [
      "algorithms/destripe/wavelet-fft.md",
    ]},
    {"Point-spread function" = [
      "algorithms/psf/bead-psf.md",
    ]},
    "algorithms/_template.md",
  ]},
  {"Contributing" = [
    "contributing/style.md",
  ]},
  {"API reference" = [
    "reference/index.md",
    "reference/configuration.md",
    "reference/estimator.md",
    "reference/estimates.md",
    "reference/io.md",
    "reference/stats.md",
    "reference/filters.md",
    "reference/basis.md",
    "reference/special.md",
    "reference/sensor.md",
    "reference/shading.md",
    "reference/deconv.md",
    "reference/destripe.md",
    "reference/psf.md",
    "reference/models.md",
    "reference/distributions.md",
    "reference/functional.md",
  ]},
]

site_name = "optix"
site_description = "Processing algorithms for microscopy"
site_url = "https://neuroscales.github.io/optix"
repo_url = "https://github.com/neuroscales/optix"
edit_uri = "blob/main/docs"
site_dir = "site"
docs_dir = "docs"
watch = ["src", "docs"]
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]

[project.theme]
features = [
  "content.code.copy",
  "navigation.indexes",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "orange"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "orange"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.plugins.mkdocstrings.handlers.python]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://pytorch.org/docs/stable/objects.inv",
]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
merge_init_into_class = true
signature_crossrefs = true
relative_crossrefs = true
separate_signature = true
members_order = "source"
show_source = false
show_root_heading = true

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.toc]
toc_depth = 3
[project.markdown_extensions.markdown_grid_tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.snippets]
base_path = ["docs"]
check_paths = true
