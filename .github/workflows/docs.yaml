name: Docs

# Build the documentation site on pull requests; build and publish it to
# GitHub Pages on pushes to main, or on demand from the Actions tab.
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - src/**
      - zensical.toml
      - pyproject.toml
      - .github/workflows/docs.yaml
  pull_request:
    paths:
      - docs/**
      - src/**
      - zensical.toml
      - pyproject.toml
      - .github/workflows/docs.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the documentation tools
        # the `doc` extra of pyproject.toml, without the package itself:
        # mkdocstrings reads the sources statically (paths = ["src"])
        run: |
          python -m pip install --upgrade pip
          python -m pip install "zensical>=0.0.11" "mkdocstrings[python]>=1.0.0" markdown-grid-tables
      - name: Build the site
        run: zensical build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
