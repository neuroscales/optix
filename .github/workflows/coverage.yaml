name: Run coverage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
      python-version:
        description: Python version
        required: true
        default: "3.11"
      pytorch-version:
        description: PyTorch version (or "latest")
        required: true
        default: "2.3.1"
      optix-compile:
        description: Value of OPTIX_COMPILE ("" = unset)
        required: false
        default: ""
      optix-dtype:
        description: Value of OPTIX_DTYPE ("" = unset)
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Commit / Branch / Tag / SHA to checkout
        required: false
        default: ""
        type: string
      python-version:
        description: Python version
        required: false
        default: "3.11"
        type: string
      pytorch-version:
        description: PyTorch version (or "latest")
        required: false
        default: "2.3.1"
        type: string
      optix-compile:
        description: Value of OPTIX_COMPILE ("" = unset)
        required: false
        default: ""
        type: string
      optix-dtype:
        description: Value of OPTIX_DTYPE ("" = unset)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        shell: bash
        env:
          PYTORCH_VERSION: ${{ inputs.pytorch-version }}
        run: |
          python -m pip install --upgrade pip
          if [ "${PYTORCH_VERSION}" = "latest" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install "torch==${PYTORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          fi
          # torch < 2.4 wheels are built against numpy 1.x: pin it in the
          # same install so the resolver cannot upgrade it again
          case "${PYTORCH_VERSION}" in
            2.3.*) pip install -e .[test] "numpy<2" ;;
            *) pip install -e .[test] ;;
          esac
      - name: Run pytest with coverage
        shell: bash
        env:
          OPTIX_COMPILE: ${{ inputs.optix-compile }}
          OPTIX_DTYPE: ${{ inputs.optix-dtype }}
        run: pytest --cov=optix --cov-report=term --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
